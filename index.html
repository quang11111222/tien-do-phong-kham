<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<style>:root{color-scheme:light dark}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Tiến độ Phòng khám TTH</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --brand:#1668C4; --brand-d:#0F4E97; --brand-soft:#E9F2FC; --brand-line:#CFE2F7;
  --ground:#F2F6FB; --surface:#FFFFFF; --surface-2:#F8FBFE; --line:#E1EAF4; --line-2:#EDF3F9;
  --ink:#12263F; --ink-2:#4E6787; --ink-3:#8A9CB4;
  --st-todo:#94A6BC; --st-doing:#1668C4; --st-pending:#C0790A; --st-done:#1C8A5B; --st-late:#C8393B;
  --st-todo-bg:#EEF2F7; --st-doing-bg:#E4EFFB; --st-pending-bg:#FBF1DF; --st-done-bg:#E3F3EB; --st-late-bg:#FBE8E8;
  --shadow:0 1px 2px rgba(18,38,63,.06), 0 8px 24px -12px rgba(18,38,63,.18);
  --weekend:#F4F7FB; --today:#C8393B;
  --row:36px; --lw:732px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --brand:#4E9BE8; --brand-d:#7FB9F0; --brand-soft:#17293D; --brand-line:#23405C;
    --ground:#0C1420; --surface:#141E2C; --surface-2:#18242F; --line:#243346; --line-2:#1D2A3A;
    --ink:#E7EEF7; --ink-2:#9FB3CB; --ink-3:#6E8299;
    --st-todo:#7F93AC; --st-doing:#4E9BE8; --st-pending:#DCA33F; --st-done:#43B183; --st-late:#E4696B;
    --st-todo-bg:#1B2634; --st-doing-bg:#152C44; --st-pending-bg:#33280F; --st-done-bg:#122E23; --st-late-bg:#361A1C;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
    --weekend:#101A27; --today:#E4696B;
  }
}
:root[data-theme="dark"]{
  --brand:#4E9BE8; --brand-d:#7FB9F0; --brand-soft:#17293D; --brand-line:#23405C;
  --ground:#0C1420; --surface:#141E2C; --surface-2:#18242F; --line:#243346; --line-2:#1D2A3A;
  --ink:#E7EEF7; --ink-2:#9FB3CB; --ink-3:#6E8299;
  --st-todo:#7F93AC; --st-doing:#4E9BE8; --st-pending:#DCA33F; --st-done:#43B183; --st-late:#E4696B;
  --st-todo-bg:#1B2634; --st-doing-bg:#152C44; --st-pending-bg:#33280F; --st-done-bg:#122E23; --st-late-bg:#361A1C;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  --weekend:#101A27; --today:#E4696B;
}
*{box-sizing:border-box}
html,body{height:100%}
body{overflow:hidden}
body{background:var(--ground);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.app{display:flex;height:100%;min-height:0}
.side{width:238px;flex:0 0 238px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100%}
.brandbox{margin:14px 12px 10px;padding:10px;border:1px solid var(--line);border-radius:12px;display:flex;gap:10px;align-items:center;background:var(--surface-2)}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(160deg,var(--brand),var(--brand-d));color:#fff;display:grid;place-items:center;font-weight:700;font-size:11px}
.brandbox b{display:block;font-size:12.5px;font-weight:700}
.brandbox span{display:block;font-size:11px;color:var(--ink-3)}
.navwrap{overflow-y:auto;flex:1;padding:0 10px 10px}
.navlabel{font-size:10px;font-weight:700;letter-spacing:.9px;color:var(--brand);text-transform:uppercase;padding:8px 8px 6px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav a{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-size:12.8px;cursor:default}
.nav a svg{flex:0 0 15px;opacity:.75}
.nav a.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav a.on svg{opacity:1}
.sub{display:flex;flex-direction:column;gap:1px;margin:3px 0 6px 10px;padding-left:11px;border-left:1.5px solid var(--brand-line)}
.sub button{text-align:left;background:none;border:0;padding:6px 9px;border-radius:7px;color:var(--ink-2);font-size:12.5px;cursor:pointer}
.sub button:hover{background:var(--line-2)}
.sub button.on{background:var(--brand);color:#fff;font-weight:600}
.sub .cap{font-size:9.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--ink-3);padding:7px 9px 3px;font-weight:700}
.clock{margin:10px 12px 14px;background:#132438;color:#DCE9F8;border-radius:11px;padding:9px 12px;text-align:center}
:root[data-theme="dark"] .clock{background:#0A1220}
.clock b{display:block;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:17px;letter-spacing:1px}
.clock span{font-size:10.5px;color:#7E9AC0}

.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.top{flex:0 0 auto;z-index:30;background:var(--ground);padding:12px 18px 10px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.search{flex:1;max-width:400px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 10px;color:var(--ink-3);font-size:12.5px}
.kbd{margin-left:auto;border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:10.5px;font-family:"JetBrains Mono",monospace}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--ink-2);font-weight:500}
.whoami{display:flex;align-items:center;gap:7px;margin-left:auto;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:4px 6px 4px 10px}
.whoami input{border:0;background:none;width:140px;font-size:12.5px;font-weight:600}
.whoami input:focus{outline:none}
.av{width:26px;height:26px;border-radius:7px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:11px}
.view{padding:16px 18px 40px;flex:1;overflow-y:auto;min-height:0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:13px}
h1{font-size:21px;font-weight:700;margin:0;letter-spacing:-.2px;text-wrap:balance}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:1px;color:var(--brand);text-transform:uppercase}
.crumb{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3);margin-bottom:3px}
.crumb button{border:0;background:none;padding:0;color:var(--brand);font-size:11.5px;font-weight:600;cursor:pointer}
.muted{color:var(--ink-2)} .tiny{font-size:11.5px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:500;cursor:pointer}
.btn:hover{border-color:var(--brand-line);color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--brand-d);border-color:var(--brand-d);color:#fff}
.btn.ok{background:var(--st-done);border-color:var(--st-done);color:#fff;font-weight:600}
.btn.ok:hover{filter:brightness(1.08);color:#fff}
.btn.dgr{color:var(--st-late);border-color:var(--st-late)}
.btn.dgr:hover{background:var(--st-late-bg);color:var(--st-late);border-color:var(--st-late)}
.btn.sm{padding:4px 9px;font-size:11.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 6px}
.p-todo{background:var(--st-todo-bg);color:var(--st-todo)} .p-doing{background:var(--st-doing-bg);color:var(--st-doing)}
.p-pending{background:var(--st-pending-bg);color:var(--st-pending)} .p-done{background:var(--st-done-bg);color:var(--st-done)}
.p-late{background:var(--st-late-bg);color:var(--st-late)}

.ovhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.stat b{display:block;font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.stat span{font-size:11.5px;color:var(--ink-2)}
.stat.hi{border-color:var(--st-late);background:var(--st-late-bg)} .stat.hi b{color:var(--st-late)}
.stat.wr{border-color:var(--st-pending);background:var(--st-pending-bg)} .stat.wr b{color:var(--st-pending)}

/* project list */
.ptab{width:100%;border-collapse:collapse}
.ptab th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--ink-3);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.ptab td{padding:11px 12px;border-bottom:1px solid var(--line-2);font-size:12.8px;vertical-align:middle}
.ptab tbody tr{cursor:pointer}
.ptab tbody tr:hover{background:var(--surface-2)}
.ptab tbody tr:last-child td{border-bottom:0}
.pname{font-weight:600;display:block}
.pcode{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.mini{width:88px;height:6px;border-radius:99px;background:var(--line-2);overflow:hidden;display:inline-block;vertical-align:middle;margin-right:7px}
.mini i{display:block;height:100%;background:var(--st-done)}
.rowact{display:flex;gap:5px;justify-content:flex-end}
.dl{color:var(--st-late);font-weight:600}
.dw{color:var(--st-pending);font-weight:600}

.bar{height:9px;border-radius:99px;background:var(--line-2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px}
.legend span{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-2)}
.legend s{width:9px;height:9px;border-radius:3px;text-decoration:none}
.pcard{padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.grpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px;margin-top:14px}
.grpc{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--st-todo);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.grpc:hover{border-color:var(--brand-line);border-left-color:var(--brand)}
.grpc b{font-size:12.5px;font-weight:600;display:block;line-height:1.35}
.grpc .m{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;margin-top:5px;display:flex;justify-content:space-between}

.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tools input[type=search],.tools select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12.5px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;padding:6px 11px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.seg button.on{background:var(--brand);color:#fff;font-weight:600}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:11.5px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.fchip.on{border-color:currentColor}

.tt{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:calc(100vh - 300px);min-height:260px;position:relative}
.trow{display:flex;min-width:min-content;height:var(--row)}
.lft{position:sticky;left:0;z-index:12;width:var(--lw);flex:0 0 var(--lw);display:flex;align-items:center;background:var(--surface);border-right:1px solid var(--line)}
.thead{position:sticky;top:0;z-index:20;height:46px}
.thead .lft{z-index:22;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;letter-spacing:.6px;color:var(--ink-3);text-transform:uppercase}
.time{position:relative;flex:0 0 auto}
.thead .time{background:var(--surface-2);border-bottom:1px solid var(--line)}
.mo{position:absolute;top:0;height:23px;border-left:1px solid var(--line);font-size:11px;font-weight:600;color:var(--ink-2);padding-left:6px;display:flex;align-items:center;white-space:nowrap;overflow:hidden}
.dy{position:absolute;top:23px;height:23px;font-size:9.5px;color:var(--ink-3);display:flex;align-items:center;justify-content:center;font-family:"JetBrains Mono",monospace}
.trow:not(.thead){border-bottom:1px solid var(--line-2);cursor:pointer}
.trow:not(.thead):hover .lft,.trow:not(.thead):hover .time{background:var(--surface-2)}
.trow.g .lft{background:var(--surface-2)}
.trow.g:hover .lft{background:var(--brand-soft)}
.trow.sel .lft,.trow.sel .time{background:var(--brand-soft)!important}
.cell{padding:0 8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12.5px}
.c-wbs{width:54px;flex:0 0 54px;color:var(--ink-3);font-size:11px;font-family:"JetBrains Mono",monospace;display:flex;align-items:center;gap:3px}
.c-name{flex:1 1 auto;min-width:0}
.trow.g .c-name{font-weight:700;font-size:12px;letter-spacing:.2px;text-transform:uppercase}
.c-lead{width:104px;flex:0 0 104px;color:var(--ink-2);font-size:11.5px}
.c-d{width:88px;flex:0 0 88px;padding:0 6px;font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:11px}
.c-n{width:88px;flex:0 0 88px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:11.5px}
.c-st{width:100px;flex:0 0 100px;display:flex;align-items:center;justify-content:flex-end}
.c-act{width:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:center;padding:0}
.rowbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:6px;width:24px;height:22px;font-size:14px;line-height:1;cursor:pointer;opacity:.5;padding:0}
.trow:hover .rowbtn{opacity:1}
.rowbtn:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.sum{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 15px;margin-bottom:11px}
.sum .u{display:flex;flex-direction:column;gap:1px;min-width:78px}
.sum .u b{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.sum .u span{font-size:10.5px;color:var(--ink-3);letter-spacing:.3px}
.sum .grow{flex:1 1 190px;min-width:150px}
.sum .grow .bar{margin-top:6px}
.alist{display:flex;flex-direction:column}
.ai{display:grid;grid-template-columns:104px 1fr auto;gap:12px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line-2);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.ai:last-child{border-bottom:0}
.ai:hover{background:var(--surface-2)}
.ai .nm{font-size:12.8px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai .sb{font-size:11px;color:var(--ink-3)}
.ai .rt{font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.secthead{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 8px}
.secthead h2{margin:0;font-size:14.5px;font-weight:700}
.ev{display:flex;flex-direction:column;gap:6px;margin-bottom:9px}
.evi{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.evi .ic{width:24px;height:24px;border-radius:6px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:11px;font-weight:700}
.evi .t{font-size:12.3px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evi .s{font-size:10.5px;color:var(--ink-3)}
.evi button{border:0;background:none;color:var(--ink-3);cursor:pointer;font-size:14px;padding:0 3px}
.evi button:hover{color:var(--st-late)}
.drop{border:1.5px dashed var(--line);border-radius:9px;padding:14px;text-align:center;color:var(--ink-3);font-size:12px;cursor:pointer;background:var(--surface)}
.drop:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.imp{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:9px}
.imp table{width:100%;border-collapse:collapse;font-size:12px}
.imp th{position:sticky;top:0;background:var(--surface-2);text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-3)}
.imp td{padding:6px 9px;border-bottom:1px solid var(--line-2)}
.imp tr.gp td{font-weight:700;background:var(--surface-2)}
.imp td.bad{color:var(--st-late);font-weight:600}
.var{font-size:10.5px;font-weight:600;margin-left:3px}
.var.up{color:var(--st-late)} .var.dn{color:var(--st-done)}
.exp{border:0;background:none;padding:0;width:13px;color:var(--ink-3);cursor:pointer;font-size:9px}
.gbar{position:absolute;top:9px;height:18px;border-radius:5px;display:flex;align-items:center;padding:0 6px;font-size:10.5px;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.gbar.pbar{top:14px;height:8px;border-radius:2px;background:var(--brand-d)}
.gbar.pbar::before,.gbar.pbar::after{content:"";position:absolute;bottom:-5px;border:5px solid transparent;border-top-color:var(--brand-d)}
.gbar.pbar::before{left:0;border-right-width:0}
.gbar.pbar::after{right:0;border-left-width:0}
.prog{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.32);border-right:1.5px solid rgba(255,255,255,.6)}
.now{position:absolute;top:0;bottom:0;width:1.5px;background:var(--today);z-index:8;pointer-events:none}
.nowlab{position:absolute;top:26px;transform:translateX(-50%);background:var(--today);color:#fff;font-size:9.5px;font-weight:700;padding:0 5px;border-radius:4px;z-index:21;white-space:nowrap}
.empty{padding:36px;text-align:center;color:var(--ink-3)}
.empty h3{margin:0 0 6px;font-size:14px;color:var(--ink)}

.scrim{position:fixed;inset:0;background:rgba(12,26,44,.35);z-index:60;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(470px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:61;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
.drawer.on{transform:none}
.dhead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.dhead h2{margin:0;font-size:15px;font-weight:700;line-height:1.35;text-wrap:balance}
.dbody{overflow-y:auto;padding:14px 16px 30px;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:14px}
#dwrap{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.dhead{flex:0 0 auto}
.sec{border:1px solid var(--line);border-radius:11px;padding:12px 13px;background:var(--surface-2)}
.sec>h3{margin:0 0 9px;font-size:10.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--ink-3)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.f label{display:block;font-size:11px;color:var(--ink-3);margin-bottom:3px;font-weight:500}
.f input,.f select,.f textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:12.5px}
.f textarea{resize:vertical;min-height:60px}
.f.ro input{background:var(--line-2);color:var(--ink-2)}
.wide{grid-column:1/-1}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.kv:last-child{border:0}
.kv b{font-weight:600;font-variant-numeric:tabular-nums}
.note{border-left:3px solid var(--brand);background:var(--brand-soft);border-radius:0 8px 8px 0;padding:8px 11px;font-size:11.8px;color:var(--ink-2)}
.note.warn{border-left-color:var(--st-pending);background:var(--st-pending-bg)}
.log{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:14px 1fr;gap:9px;padding-bottom:11px;position:relative}
.li::before{content:"";position:absolute;left:6px;top:14px;bottom:0;width:1px;background:var(--line)}
.li:last-child::before{display:none}
.dot{width:9px;height:9px;border-radius:50%;background:var(--brand);margin-top:5px;border:2px solid var(--surface-2);box-sizing:content-box}
.li .m{font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.li p{margin:1px 0 0;font-size:12.5px}
.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.modal{position:fixed;inset:0;z-index:70;display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow-y:auto;background:rgba(12,26,44,.4)}
.modal.on{display:flex}
.mbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:min(560px,100%);box-shadow:var(--shadow)}
.mbox header{padding:14px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.mbox header h2{margin:0;font-size:15.5px;font-weight:700}
.mbody{padding:15px 17px;display:flex;flex-direction:column;gap:11px}
.mfoot{padding:12px 17px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#132438;color:#fff;padding:8px 16px;border-radius:9px;font-size:12.5px;z-index:90;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.offline{margin-bottom:12px}
@media (max-width:1180px){ :root{--lw:452px} .c-lead,.c-d{display:none} .hcol{display:none} }
@media (max-width:860px){ .side{display:none} :root{--lw:260px} .c-n{display:none} }
</style>

/* ---------- Excel: nạp vào / xuất ra ---------- */
function pdate(v){
  if(v===null||v===undefined||v==="")return null;
  if(v instanceof Date&&!isNaN(v))return iso(v);
  var sv=String(v).trim(),m;
  m=sv.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(m){var y=+m[3];if(y<100)y+=2000;return iso(new Date(y,+m[2]-1,+m[1]))}
  m=sv.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return iso(new Date(+m[1],+m[2]-1,+m[3]));
  if(/^\d+(\.\d+)?$/.test(sv)){
    var d=new Date(Date.UTC(1899,11,30)+Math.round(+sv)*864e5);
    return iso(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()));
  }
  return null;
}
function isRoman(v){return /^[IVXLCDM]+$/.test(String(v||"").trim())}
function parseSheet(ws){
  var rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,cellDates:true,defval:""});
  var hi=-1,col={};
  for(var r=0;r<Math.min(rows.length,25);r++){
    var row=rows[r],found={};
    for(var c=0;c<row.length;c++){
      var v=String(row[c]||"").toLowerCase().trim();
      if(/hạng mục|công việc|nội dung/.test(v)&&found.name===undefined)found.name=c;
      if(/chủ trì|phối hợp|đơn vị|bộ phận/.test(v)&&found.lead===undefined)found.lead=c;
      if(/^bắt đầu|ngày bắt đầu|start/.test(v)&&found.s===undefined)found.s=c;
      if(/^kết thúc|ngày kết thúc|end|hoàn thành/.test(v)&&found.e===undefined)found.e=c;
      if(/^stt|^mã|^tt$/.test(v)&&found.stt===undefined)found.stt=c;
    }
    if(found.name!==undefined&&found.s!==undefined&&found.e!==undefined){hi=r;col=found;break}
  }
  if(hi<0)return {err:"Không tìm thấy dòng tiêu đề. File cần có các cột: Hạng mục công việc, Bắt đầu, Kết thúc."};
  if(col.stt===undefined)col.stt=Math.max(0,col.name-1);
  var out=[],gi=0,ci=0,cur=null;
  for(var r2=hi+1;r2<rows.length;r2++){
    var row2=rows[r2];
    var nm=String(row2[col.name]||"").replace(/\s+/g," ").trim();
    if(!nm)continue;
    var stt=String(row2[col.stt]||"").trim();
    var st=pdate(row2[col.s]),en=pdate(row2[col.e]);
    var lead=String(col.lead!==undefined?row2[col.lead]||"":"").replace(/\s+/g," ").trim();
    var grp=isRoman(stt)||(!stt&&!st&&!en);
    if(grp){
      gi++;ci=0;cur="G"+gi;
      out.push({id:cur,lv:1,pid:null,wbs:ROMAN[gi-1]||String(gi),name:nm,lead:"",coop:[],start:null,end:null,st:"todo",ev:[],_row:r2+1});
    }else{
      if(!cur){gi++;cur="G"+gi;out.push({id:cur,lv:1,pid:null,wbs:ROMAN[gi-1]||String(gi),name:"CHƯA PHÂN NHÓM",lead:"",coop:[],start:null,end:null,st:"todo",ev:[],_row:r2+1})}
      ci++;
      var parts=lead.split("/").map(function(x){return x.replace(/(chủ trì|phối hợp)/ig,"").trim()}).filter(Boolean);
      out.push({id:cur+"-"+ci,lv:2,pid:cur,wbs:String(ci),name:nm,lead:parts[0]||"",coop:parts.slice(1),
                start:st,end:en,st:"todo",ev:[],_row:r2+1,_err:(!st||!en)?"thiếu ngày":((st&&en&&en<st)?"kết thúc trước bắt đầu":"")});
    }
  }
  return {tasks:out};
}
function importModal(){
  var h='<header><h2>Nạp tiến độ từ file Excel</h2><button class="btn" id="mx">✕</button></header><div class="mbody">'+
    '<div class="drop" id="i-drop">Bấm để chọn file .xlsx / .xls / .csv</div><input type="file" id="i-file" accept=".xlsx,.xls,.csv" style="display:none">'+
    '<div id="i-body"></div>'+
    '<div class="note">Hệ thống tự nhận cột <b>Hạng mục công việc</b>, <b>Chủ trì / phối hợp</b>, <b>Bắt đầu</b>, <b>Kết thúc</b>. Dòng có số thứ tự kiểu I, II, III được hiểu là hạng mục cha; dòng đánh số 1, 2, 3 là công việc con. Số ngày hệ thống tự tính, không lấy từ file.</div>'+
    '<div><button class="btn sm" id="i-tpl">Tải file mẫu</button></div>'+
    '</div><div class="mfoot"><button class="btn" id="mc">Huỷ</button><button class="btn pri" id="mo" disabled>Nạp vào dự án</button></div>';
  $("#mbox").innerHTML=h;$("#modal").classList.add("on");
  var close=function(){$("#modal").classList.remove("on")};
  $("#mx").onclick=close;$("#mc").onclick=close;
  document.getElementById("i-tpl").onclick=downloadTemplate;
  document.getElementById("i-drop").onclick=function(){document.getElementById("i-file").click()};
  var parsed=null;
  document.getElementById("i-file").onchange=function(){
    var f=this.files&&this.files[0];if(!f)return;
    var fr=new FileReader();
    fr.onload=function(e){
      var wb;
      try{wb=XLSX.read(new Uint8Array(e.target.result),{type:"array",cellDates:true})}
      catch(x){document.getElementById("i-body").innerHTML='<div class="note warn">Không đọc được file. Kiểm tra lại định dạng .xlsx.</div>';return}
      var names=wb.SheetNames;
      var pick=names.filter(function(n){return /tiến độ|tien do/i.test(n)})[0]||names[0];
      renderPreview(wb,pick,names);
    };
    fr.readAsArrayBuffer(f);
  };
  function renderPreview(wb,sheet,names){
    var res=parseSheet(wb.Sheets[sheet]);
    var b=document.getElementById("i-body");
    var sel=names.length>1?'<div class="f" style="margin-bottom:9px"><label for="i-sh">Sheet</label><select id="i-sh">'+
      names.map(function(n){return '<option'+(n===sheet?" selected":"")+">"+esc(n)+"</option>"}).join("")+"</select></div>":"";
    if(res.err){b.innerHTML=sel+'<div class="note warn">'+esc(res.err)+"</div>";parsed=null;$("#mo").disabled=true}
    else{
      var ch=res.tasks.filter(function(t){return t.lv===2}),bad=ch.filter(function(t){return t._err});
      b.innerHTML=sel+'<div class="row2" style="margin:9px 0"><span class="pill p-done"><i></i>'+res.tasks.filter(function(t){return t.lv===1}).length+" hạng mục</span>"+
        '<span class="pill p-doing"><i></i>'+ch.length+" công việc</span>"+
        (bad.length?'<span class="pill p-late"><i></i>'+bad.length+" dòng lỗi</span>":'<span class="pill p-done"><i></i>không có lỗi</span>')+"</div>"+
        '<div class="imp"><table><thead><tr><th>Dòng</th><th>Mã</th><th>Hạng mục / công việc</th><th>Chủ trì</th><th>Bắt đầu</th><th>Kết thúc</th><th>Ngày</th></tr></thead><tbody>'+
        res.tasks.map(function(t){
          return '<tr class="'+(t.lv===1?"gp":"")+'"><td>'+t._row+"</td><td>"+esc(t.wbs)+"</td><td>"+esc(t.name)+"</td><td>"+esc(t.lead||"")+"</td>"+
            '<td class="'+(t._err?"bad":"")+'">'+(t.start?vn(t.start):(t.lv===2?"—":""))+"</td>"+
            '<td class="'+(t._err?"bad":"")+'">'+(t.end?vn(t.end):(t.lv===2?"—":""))+"</td>"+
            "<td>"+(t.start&&t.end?days(t.start,t.end):"")+"</td></tr>"}).join("")+"</tbody></table></div>"+
        (bad.length?'<div class="note warn" style="margin-top:9px">Dòng thiếu ngày vẫn nạp được, nhưng sẽ không hiện trên sơ đồ Gantt cho tới khi điền ngày.</div>':"");
      parsed=res.tasks;$("#mo").disabled=false;
      if(document.getElementById("i-sh"))document.getElementById("i-sh").onchange=function(){renderPreview(wb,this.value,names)};
    }
  }
  $("#mo").onclick=function(){
    if(!parsed)return;
    if(tasks().length&&!confirm("Thay toàn bộ "+tasks().filter(function(t){return t.lv===2}).length+" công việc hiện có bằng dữ liệu từ file?"))return;
    plan={tasks:parsed.map(function(t){var o=Object.assign({},t);delete o._row;delete o._err;return o})};

    var k=kids(g.id).filter(function(c){
      if(ui.lead&&c.lead!==ui.lead)return false;

  if(!rows.length)v+='<div class="empty">Không có đầu việc nào khớp bộ lọc.</div>';
  v+="</div>";
  $("#view").innerHTML=v;bindHead();
  $("#q").oninput=function(){ui.q=this.value;var p=this.selectionStart;renderGantt();var q2=$("#q");q2.focus();q2.setSelectionRange(p,p)};
  $("#fl").onchange=function(){ui.lead=this.value;renderGantt()};
  all("[data-st]").forEach(function(b){b.onclick=function(){ui.st=ui.st===b.dataset.st?"":b.dataset.st;renderGantt()}});
  all("[data-z]").forEach(function(b){b.onclick=function(){ui.zoom=b.dataset.z;renderGantt();scrollToday()}});
  $("#tdy").onclick=scrollToday;
  $("#tog").onclick=function(){
    var any=tasks().some(function(t){return t.lv===1&&!ui.closed[t.id]});
    ui.closed={};if(any)tasks().forEach(function(t){if(t.lv===1)ui.closed[t.id]=1});renderGantt();
  };
  all(".exp").forEach(function(b){b.onclick=function(e){e.stopPropagation();ui.closed[b.dataset.x]=!ui.closed[b.dataset.x];renderGantt()}});
  all("[data-add]").forEach(function(b){b.onclick=function(e){e.stopPropagation();
    promptModal("Thêm công việc","Tên công việc",'',function(v){
      ui.closed[b.dataset.add]=false;var nid=addChild(b.dataset.add,v);render();openDrawer(nid)})}});
  $("#addg2").onclick=addGroup;
  $("#imp").onclick=importModal;
  $("#exp").onclick=exportXlsx;
  all(".trow[data-id]").forEach(function(r){r.onclick=function(){openDrawer(r.dataset.id)}});
  scrollToday();
}
function scrollToday(){var tt=$("#tt"),n=document.querySelector(".now");if(!tt||!n)return;
  var x=n.getBoundingClientRect().left-tt.getBoundingClientRect().left+tt.scrollLeft;
  tt.scrollLeft=Math.max(0,x-Math.round(tt.clientWidth*.45));}

/* ---------- drawer ---------- */
function openDrawer(id){
  var t=tasks().filter(function(x){return x.id===id})[0];if(!t)return;
  ui.sel=id;
  var sp=span(t),st=stOf(t),n=sp.s&&sp.e?days(sp.s,sp.e):0,k=kids(t.id);
  var par=t.lv===1?null:tasks().filter(function(x){return x.id===t.pid})[0];
  var ent=(logs.byTask[id]||{}).entries||[];
  var h='<div class="dhead"><div style="flex:1;min-width:0"><div class="eyebrow">'+(par?esc(par.wbs)+". "+esc(par.name):"Hạng mục")+"</div>"+
    "<h2>"+esc(t.wbs)+". "+esc(t.name)+'</h2><div style="margin-top:6px"><span class="pill '+ST[st][1]+'"><i></i>'+ST[st][0]+"</span></div></div>"+
    '<button class="btn" id="dx" aria-label="Đóng">✕</button></div><div class="dbody">';
  var grps=tasks().filter(function(x){return x.lv===1});
  h+='<div class="sec"><h3>Thông tin công việc</h3><div class="fg">'+
    '<div class="f wide"><label for="d-name">'+(t.lv===1?"Tên hạng mục":"Tên công việc")+'</label><textarea id="d-name" rows="2">'+esc(t.name)+"</textarea></div>"+
    (t.lv===2?'<div class="f wide"><label for="d-par">Thuộc hạng mục</label><select id="d-par">'+grps.map(function(g){
      return '<option value="'+g.id+'"'+(g.id===t.pid?" selected":"")+">"+esc(g.wbs)+". "+esc(g.name)+"</option>"}).join("")+"</select></div>":"")+
    '<div class="f wide"><label for="d-lead">Đơn vị chủ trì (1 đơn vị chịu trách nhiệm)</label>'+
      '<select id="d-lead"'+(t.lv===1?" disabled":"")+'><option value="">— chưa gán —</option>'+leads().map(function(l){return '<option'+(t.lead===l?" selected":"")+">"+esc(l)+"</option>"}).join("")+"</select></div>"+
    '<div class="f wide"><label for="d-coop">Đơn vị phối hợp</label><input id="d-coop" value="'+esc((t.coop||[]).join(", "))+'" placeholder="ngăn cách bằng dấu phẩy"'+(t.lv===1?" disabled":"")+"></div>"+
    '<div class="f'+(t.lv===1?" ro":"")+'"><label for="d-s">Bắt đầu</label><input type="date" id="d-s" value="'+(sp.s||"")+'"'+(t.lv===1?" disabled":"")+"></div>"+
    '<div class="f'+(t.lv===1?" ro":"")+'"><label for="d-e">Kết thúc</label><input type="date" id="d-e" value="'+(sp.e||"")+'"'+(t.lv===1?" disabled":"")+"></div>"+
    '<div class="f ro wide"><label>Số ngày (tự tính = Kết thúc − Bắt đầu + 1, theo ngày lịch)</label><input value="'+(n||"—")+'" readonly></div>'+
    (t.lv===2?'<div class="f wide"><label for="d-pct">% hoàn thành</label><input type="number" id="d-pct" min="0" max="100" step="5" value="'+(t.pct||0)+'"></div>':"")+"</div>"+
    (t.lv===1?'<div class="note" style="margin-top:10px">Ngày của hạng mục tự tính từ '+k.length+" công việc con (sớm nhất → muộn nhất), không sửa trực tiếp.</div>":"")+
    '<div style="margin-top:10px"><button class="btn pri" id="d-save">Lưu thay đổi</button></div></div>';
  h+='<div class="sec"><h3>Hoàn thành &amp; bằng chứng</h3>';
  if(t.lv===2){
    var ev=t.ev||[];
    h+='<div class="kv"><span>Số ngày kế hoạch</span><b>'+(planDays(t)||"—")+"</b></div>";
    if(t.st==="done"){
      h+='<div class="kv"><span>Ngày báo xong</span><b>'+vn(t.doneAt)+"</b></div>"+
         '<div class="kv"><span>Người báo</span><b>'+esc(t.doneBy||"—")+"</b></div>"+
         '<div class="kv"><span>Số ngày thực tế</span><b>'+(actDays(t)||"—")+"</b></div>"+
         '<div class="kv"><span>Lệch so với kế hoạch</span><b class="'+(varDays(t)>0?"dl":(varDays(t)<0?"":""))+'" style="color:'+(varDays(t)>0?"var(--st-late)":(varDays(t)<0?"var(--st-done)":"inherit"))+'">'+
           (varDays(t)>0?"+"+varDays(t)+" ngày":(varDays(t)<0?varDays(t)+" ngày":"đúng hạn"))+"</b></div>";
    }
    h+='<div style="margin:11px 0 7px;font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.4px">TÀI LIỆU BẰNG CHỨNG ('+ev.length+")</div>";
    if(ev.length)h+='<div class="ev">'+ev.map(function(e,ix){
      return '<div class="evi"><span class="ic">'+(e.kind==="link"?"↗":"FILE")+'</span><span style="min-width:0"><span class="t">'+esc(e.name)+
        '</span><span class="s">'+(e.kind==="link"?esc(e.url||"đường dẫn"):(e.size?Math.round(e.size/1024)+" KB":"—"))+
        (e.by?" · "+esc(e.by):"")+(e.at?" · "+vn(e.at):"")+'</span></span><button data-rmev="'+ix+'" title="Bỏ">✕</button></div>'}).join("")+"</div>";
    h+='<div class="drop" id="d-drop">Bấm để chọn tệp bằng chứng (biên bản, ảnh hiện trường, hồ sơ nghiệm thu…)</div>'+
       '<input type="file" id="d-file" multiple style="display:none">'+
       '<div class="row2" style="margin-top:7px"><button class="btn sm" id="d-link">+ Dán đường dẫn tài liệu</button></div>';
    if(t.st!=="done"){
      h+='<div class="f" style="margin-top:11px"><label for="d-doneat">Ngày hoàn thành thực tế</label><input type="date" id="d-doneat" value="'+TODAY+'"></div>'+
         '<div style="margin-top:9px"><button class="btn ok" id="d-done"'+(ev.length?"":" disabled")+'>Báo xong</button>'+
         (ev.length?"":'<span class="tiny muted" style="margin-left:9px">Cần ít nhất 1 tài liệu bằng chứng</span>')+"</div>";
    }else{
      h+='<div style="margin-top:10px"><button class="btn" id="d-reopen">Mở lại công việc</button></div>';
    }
    if(t.st==="late"||(t.end&&t.end<TODAY&&t.st!=="done")){
      h+='<div class="f" style="margin-top:12px"><label for="d-cause">Quá hạn — phân loại nguyên nhân</label><select id="d-cause">'+
        '<option value="">— chưa phân loại —</option><option value="cq"'+(t.cause==="cq"?" selected":"")+'>Chủ quan</option><option value="kq"'+(t.cause==="kq"?" selected":"")+'>Khách quan</option></select></div>'+
        '<div class="f" style="margin-top:8px"><label for="d-why">Lý do</label><input id="d-why" value="'+esc(t.why||"")+'"></div>'+
        '<div style="margin-top:9px"><button class="btn" id="d-cause-save">Lưu nguyên nhân</button></div>';
    }
  }else{
    var und=k.filter(function(c){return c.st!=="done"}).length;
    var pd=k.reduce(function(x,c){return x+planDays(c)},0),ad=k.reduce(function(x,c){return x+actDays(c)},0);
    h+='<div class="kv"><span>Công việc con đã xong</span><b>'+(k.length-und)+"/"+k.length+"</b></div>"+
       '<div class="kv"><span>Tổng ngày kế hoạch (cộng dồn)</span><b>'+pd+"</b></div>"+
       '<div class="kv"><span>Tổng ngày thực tế (phần đã xong)</span><b>'+(ad||"—")+"</b></div>";
    h+='<div class="note" style="margin-top:9px">Hạng mục tự động chuyển sang Hoàn thành khi tất cả công việc con đã báo xong kèm bằng chứng. Không cần ai duyệt.</div>';
  }
  h+="</div>";
  h+='<div class="sec"><h3>Thao tác</h3><div class="row2">'+
    '<button class="btn" id="d-up">↑ Lên</button><button class="btn" id="d-down">↓ Xuống</button>'+
    (t.lv===2?'<button class="btn" id="d-dup">Nhân đôi</button>':'<button class="btn" id="d-addc">+ Công việc con</button>')+
    '<button class="btn dgr" id="d-del">Xoá</button></div>'+
    (t.lv===1?'<div class="tiny muted" style="margin-top:8px">Xoá hạng mục sẽ xoá cả '+k.length+" công việc con và diễn biến của chúng.</div>":"")+"</div>";
  h+='<div class="sec"><h3>Diễn biến công việc ('+ent.length+")</h3>"+
    (ent.length?'<div class="log">'+ent.slice().reverse().map(function(e){
      return '<div class="li"><div class="dot"></div><div><div class="m">'+vn(e.at)+" · "+esc(e.by)+"</div><p>"+esc(e.text)+"</p></div></div>"}).join("")+"</div>":
      '<div class="tiny muted" style="margin-bottom:9px">Chưa có diễn biến nào.</div>')+
    '<div class="f"><label for="d-log">Ghi diễn biến mới</label><textarea id="d-log" placeholder="Hiện trường hôm nay thế nào? Vướng gì?"></textarea></div>'+
    '<div style="margin-top:8px"><button class="btn pri" id="d-add">Ghi diễn biến</button></div></div></div>';
  $("#dwrap").innerHTML=h;
  $("#drawer").classList.add("on");$("#drawer").setAttribute("aria-hidden","false");$("#scrim").classList.add("on");
  bindDrawer(t);
  if(ui.page==="gantt")renderGantt();
}
function closeDrawer(){$("#drawer").classList.remove("on");$("#drawer").setAttribute("aria-hidden","true");$("#scrim").classList.remove("on");ui.sel=null;if(ui.page==="gantt")renderGantt()}
function bindDrawer(t){
  var g=function(i){return document.getElementById(i)};
  g("dx").onclick=closeDrawer;
  if(g("d-save"))g("d-save").onclick=function(){
    var nm=g("d-name").value.trim();
    if(!nm){toast("Tên không được để trống");return}
    t.name=nm;
    if(t.lv===1){rebuild();savePlan();openDrawer(t.id);return}
    t.lead=g("d-lead").value;
    t.coop=g("d-coop").value.split(",").map(function(s){return s.trim()}).filter(Boolean);
    var s=g("d-s").value,e=g("d-e").value;
    if(s&&e&&e<s){toast("Ngày kết thúc phải sau ngày bắt đầu");return}
    t.start=s||null;t.end=e||null;
    if(g("d-pct"))t.pct=+g("d-pct").value||0;
    if(t.end&&t.end<TODAY&&t.st==="doing")t.st="late";
    if(g("d-par")&&g("d-par").value!==t.pid){
      var np=g("d-par").value,arr=plan.tasks;
      arr.splice(arr.indexOf(t),1);t.pid=np;
      var kk=kids(np);arr.splice(arr.indexOf(kk.length?kk[kk.length-1]:byId(np))+1,0,t);
    }
    rebuild();savePlan();openDrawer(t.id);
  };
  g("d-up").onclick=function(){moveTask(t.id,-1);render();openDrawer(t.id)};
  g("d-down").onclick=function(){moveTask(t.id,1);render();openDrawer(t.id)};
  if(g("d-dup"))g("d-dup").onclick=function(){var id=dupTask(t.id);render();if(id)openDrawer(id)};
  if(g("d-addc"))g("d-addc").onclick=function(){
    promptModal("Thêm công việc","Tên công việc","",function(v){
      ui.closed[t.id]=false;var id=addChild(t.id,v);render();openDrawer(id)})};
  g("d-del").onclick=function(){
    if(!confirm("Xoá “"+t.name+"”?"+(t.lv===1?"\nCả "+k.length+" công việc con cũng bị xoá.":"")))return;
    delTask(t.id);closeDrawer();render();
  };
  if(g("d-drop"))g("d-drop").onclick=function(){g("d-file").click()};
  if(g("d-file"))g("d-file").onchange=function(){
    var fs=Array.prototype.slice.call(this.files||[]);
    if(!fs.length)return;
    t.ev=(t.ev||[]).concat(fs.map(function(f){
      return {id:uid(),name:f.name,size:f.size,type:f.type||"",kind:"file",at:TODAY,by:who()}}));
    savePlan();openDrawer(t.id);
  };
  if(g("d-link"))g("d-link").onclick=function(){
    promptModal("Đường dẫn tài liệu","Dán link (SharePoint, OneDrive, Drive, ổ mạng…)","",function(v){
      var nm=v.split(/[\\/]/).pop()||v;
      t.ev=(t.ev||[]).concat([{id:uid(),name:nm.slice(0,80),url:v,kind:"link",at:TODAY,by:who()}]);
      savePlan();openDrawer(t.id);
    })};
  all("[data-rmev]").forEach(function(b){b.onclick=function(){
    t.ev.splice(+b.dataset.rmev,1);savePlan();openDrawer(t.id)}});
  if(g("d-done"))g("d-done").onclick=function(){
    if(!(t.ev||[]).length){toast("Cần ít nhất 1 tài liệu bằng chứng");return}
    var d=g("d-doneat").value||TODAY;
    if(t.start&&d<t.start){toast("Ngày hoàn thành không thể trước ngày bắt đầu");return}
    t.st="done";t.doneAt=d;t.doneBy=who();
    addLog(t.id,"Báo xong ngày "+vn(d)+", kèm "+t.ev.length+" tài liệu bằng chứng.");
    savePlan();openDrawer(t.id);
  };
  if(g("d-reopen"))g("d-reopen").onclick=function(){
    t.st=(t.end&&t.end<TODAY)?"late":"doing";delete t.doneAt;delete t.doneBy;
    addLog(t.id,"Mở lại công việc.");savePlan();openDrawer(t.id);
  };
  if(g("d-cause-save"))g("d-cause-save").onclick=function(){
    t.cause=g("d-cause").value;t.why=g("d-why").value.trim();
    if(t.end&&t.end<TODAY&&t.st!=="done")t.st="late";
    savePlan();openDrawer(t.id);
  };
  g("d-add").onclick=function(){
    var v=g("d-log").value.trim();if(!v){toast("Chưa nhập nội dung");return}
    addLog(t.id,v);openDrawer(t.id);
  };
}
function addLog(id,text){
  if(!logs.byTask[id])logs.byTask[id]={entries:[]};
  logs.byTask[id].entries.push({at:TODAY,by:who(),text:text,kind:"note"});
  saveLogs();
}

/* ---------- boot ---------- */
function render(){
  if(ui.page==="home"||!cur){renderHome();return}
  if(!plan){$("#view").innerHTML='<div class="card empty">Đang tải tiến độ…</div>';return}
  if(ui.page==="ov")renderOverview();else if(ui.page==="log")renderLog();else renderGantt();
}
$("#scrim").onclick=closeDrawer;
$("#modal").onclick=function(e){if(e.target===this)this.classList.remove("on")};
document.addEventListener("keydown",function(e){if(e.key==="Escape"){closeDrawer();$("#modal").classList.remove("on")}});
$("#who").addEventListener("input",function(){
  $("#avi").textContent=initials(this.value).toUpperCase()||"?";
  try{localStorage.setItem("pk_who",this.value)}catch(x){}
});
try{var w0=localStorage.getItem("pk_who");if(w0)$("#who").value=w0}catch(x){}
$("#avi").textContent=initials($("#who").value).toUpperCase();
(function tick(){
  var d=new Date(),p=function(n){return String(n).padStart(2,"0")};
  $("#clk").textContent=p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());
  $("#clkd").textContent=["CN","T2","T3","T4","T5","T6","T7"][d.getDay()]+", "+p(d.getDate())+"/"+p(d.getMonth()+1);
  setTimeout(tick,1000);
})();
drawNav();render();boot();
})();
</script>
</body>
</html>
